# Rhino package manager manifest for Physalia.
#
# Kept in the repo and COPIED into the staging folder by Stage-YakPackage.ps1, rather than
# regenerated by `yak spec` each release: spec reads the assembly attributes and would quietly
# overwrite anything hand-written here. Run `yak spec` only to see what it reads.
#
# Two fields are load-bearing beyond the listing:
#   * version  — must match <Version> in src/Physalia.GH/Physalia.GH.csproj. The package manager
#                compares it to decide whether to auto-update an installed copy, silently, at
#                startup. Stage-YakPackage.ps1 fails the build if the two drift apart.
#   * keywords — the last entry is Physalia_GHInfo.Id, NOT decoration. It is how Grasshopper's
#                package restore finds this package for a definition that needs it: a user opening
#                somebody else's .gh gets offered the install instead of a canvas full of red.
#
# There is no `license` field in the yak schema. Physalia is AGPL-3.0-or-later, which means whoever
# receives the binary must be able to get the corresponding source — `url` below plus the LICENSE
# file inside the package is what discharges that. So never build a package from a dirty worktree:
# the source that URL serves must be the source that built the binary.

name: physalia
version: 1.0.0
authors:
  - Thomas Gaudin
description: >
  AI pipelines inside Grasshopper. Physalia wires an LLM to your Rhino document, your canvas and
  your project files as a visual node graph: it can build definitions, write and push scripts, read
  drawings and live APIs, call MCP servers, and drive itself from triggers under a spend cap.
url: "https://github.com/aarcThom/Physalia"
icon: icon.png
keywords:
  - ai
  - llm
  - claude
  - openai
  - gemini
  - mcp
  - automation
  - scripting
  - 862C53A2-69A1-4B56-A133-26E0BCEDE789
